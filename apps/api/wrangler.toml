name = "kuk-saarthi-api"
main = "src/index.ts"
compatibility_date = "2026-01-01"

# Better Auth reaches for node:crypto and node:async_hooks. Without this the
# Worker does not fail at deploy — it fails to start, with "No such module".
compatibility_flags = ["nodejs_compat"]

# The client's account. See docs/12 for how access is granted — never a shared
# login; this is a member invite, so wrangler runs as your own identity.
#
# account_id MUST sit above every [section]. In TOML a bare key after a section
# header belongs to that section, and putting it below [triggers] made wrangler
# warn "Unexpected fields found in triggers field: account_id" and ignore it.
account_id = "4768790aa47814f60dd70c187c7a7bd9"

# A cache in front of this Worker, and the reason it is safe to turn on.
#
# A hit is answered at the edge WITHOUT running this Worker at all: no CPU, no
# Neon query, no R2 read. That is the whole point — the photographs and the six
# content feeds are the same bytes for every visitor in the district, and they
# were being rebuilt from the database and the bucket on every launch of every
# copy of the app.
#
# It works on workers.dev, which the Cache API does not, and it is free: hits
# bill as a request and nothing else. No custom domain needed to get the win.
#
# THE DANGEROUS DEFAULT, and what was done about it: a 200 with no
# cache-control is cached for two hours by heuristic freshness, so silence is
# opting IN. `json()` in src/index.ts therefore answers `no-store` unless the
# route says otherwise, and only four routes say otherwise. Anything carrying
# an Authorization header bypasses the cache in any case.
#
# Cache keys carry the Worker version, so a deploy invalidates everything —
# which is exactly right for /config and /vapid, whose answers only change when
# this file or a secret does.
[cache]
enabled = true

# The database is Neon Postgres, reached over a URL rather than a binding —
# so there is no [[d1_databases]] section here any more, and NEON_DB_URL is a
# SECRET (`wrangler secret put NEON_DB_URL`), listed at the bottom with the
# others. A binding could not leak because it was not a value; a connection
# string is one, and it carries the password. Never put it in this file.

# Transactional email — the verification link and the password reset, and
# nothing else. Same account as the Worker, so there is no API key to hold and
# nothing to rotate.
#
# `allowed_sender_addresses` is the point of restricting it: the binding can
# send as this one address and no other, so a bug in src/email.ts cannot start
# sending as someone at a domain that happens to share the account.
#
# UNUSED while EMAIL_PROVIDER is "resend". Kept because it costs nothing and is
# the fallback if Resend is ever dropped — at which point the domain would need
# `npx wrangler email sending enable <domain>` first, which never happened here
# (the API answered 2036 Unauthorized on every attempt) and is why Resend won.
[[send_email]]
name = "EMAIL"
allowed_sender_addresses = ["noreply@kkr.indietribe.space"]

# Not read when EMAIL_PROVIDER is "resend" or "log". The address here has to
# agree with EMAIL_FROM below — wrangler will not check that for you, and the
# failure is a send refused at runtime rather than a bad deploy.

# Photographs. Every image the app shows is an object in here, keyed by the id
# the content already uses ("brahma-sarovar" -> brahma-sarovar.webp), so moving
# off the bundle needed no change to a single `img` or `gallery` value in the
# database. Served by the /img/ route below, never made public directly — the
# Worker is what puts caching and a content type on the response.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "kuk-saarthi-media"
# `wrangler dev` talks to the REAL bucket, not an empty local emulation.
#
# It used to be local, and that was right when the database was local too:
# both halves of a development environment were copies. Since the database
# moved to Neon there is only one of it, so a local bucket made the dashboard
# incoherent — real content rows, listing 99 photographs, against a bucket
# holding none. Every /img/ 404'd and the media library was empty.
#
# The cost is the same one the database already carries: an upload or a delete
# from a laptop is an upload or a delete in production. See docs/15.
remote = true

[vars]
# The app's origin, for the notification's click-through. Also the one origin
# Better Auth will accept requests from — a typo here is a login that fails
# with a CORS error rather than a wrong answer.
APP_URL = "https://kuk-saarthi.pages.dev/"
# This Worker's own public URL. Better Auth builds OAuth callback URLs from it,
# so it must match what is registered with Google exactly.
API_URL = "https://kuk-saarthi-api.indiefluence-in-media.workers.dev"
# mailto: address Web Push requires as the JWT subject.
VAPID_SUBJECT = "mailto:REPLACE@example.org"
# Outgoing mail. Change these two to move to another sender — Resend needs
# EMAIL_PROVIDER = "resend" and a RESEND_API_KEY secret, and nothing else.
# "log" prints the email instead of sending it, which is what a machine with
# no mail credentials should do.
EMAIL_PROVIDER = "resend"
EMAIL_FROM = "noreply@kkr.indietribe.space"
EMAIL_NAME = "Kurukshetra Saarthi"
# Who may reach /admin. Comma-separated, case-insensitive. THE authority on
# admin access — the database is not consulted, so there is no role to set and
# no password for anyone to hand over. Empty means nobody. See docs/15.
ADMIN_EMAILS = "anuragmishra262000@gmail.com,indiefluence.in.media@gmail.com"

# Every quarter hour. The notify() window is 45 minutes and `sent` makes a
# repeat a no-op, so a missed run is survivable and a double run is harmless —
# the only way a scheduler nobody watches can be trusted.
[triggers]
crons = ["*/15 * * * *"]

# Secrets — set with `wrangler secret put`, never in this file:
#   NEON_DB_URL           the Postgres connection string. THE database.
#   RESEND_API_KEY        only when EMAIL_PROVIDER = "resend"
#   VAPID_PUBLIC
#   VAPID_PRIVATE
#   AUTH_SECRET           openssl rand -base64 32. Rotating it logs everyone out.
#   GOOGLE_CLIENT_ID      optional — until both are set the Google button is
#   GOOGLE_CLIENT_SECRET  not offered at all, rather than offered and broken.
