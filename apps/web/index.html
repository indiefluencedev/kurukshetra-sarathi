<!-- iOS does not read the web app manifest. Safari's "Add to Home Screen"
     takes the icon from this link and nothing else; without it the home
     screen gets a blurry screenshot of the page. The two apple- meta tags
     are what make it launch chromeless on older iOS, which still matters
     for the visitor on a five-year-old iPhone this app is built for. -->
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
