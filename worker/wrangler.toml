name = "kuk-saarthi-api"
main = "src/index.ts"
compatibility_date = "2026-01-01"

# The client's account. See docs/12 for how access is granted — never a shared
# login; this is a member invite, so wrangler runs as your own identity.
#
# account_id MUST sit above every [section]. In TOML a bare key after a section
# header belongs to that section, and putting it below [triggers] made wrangler
# warn "Unexpected fields found in triggers field: account_id" and ignore it.
account_id = "4768790aa47814f60dd70c187c7a7bd9"

[[d1_databases]]
binding = "DB"
database_name = "discover_kurukshetra"
database_id = "43389d66-b722-40bc-ae9f-ea5c194a6edf"

[vars]
# The app's origin, for the notification's click-through.
APP_URL = "https://kuk-saarthi.pages.dev/"
# mailto: address Web Push requires as the JWT subject.
VAPID_SUBJECT = "mailto:REPLACE@example.org"

# Every quarter hour. The notify() window is 45 minutes and `sent` makes a
# repeat a no-op, so a missed run is survivable and a double run is harmless —
# the only way a scheduler nobody watches can be trusted.
[triggers]
crons = ["*/15 * * * *"]

# Secrets — set with `wrangler secret put`, never in this file:
#   VAPID_PUBLIC
#   VAPID_PRIVATE
